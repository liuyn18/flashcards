1px solid #303d4e;border-radius:0;padding:12px 2px;background:transparent}.library .item p{margin:2px 0}.library .item .answer-preview{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#a2afc0;font-size:14px;white-space:pre-wrap}.library .item .meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px;margin-top:5px}.library .item .manage{display:flex;align-items:center;gap:4px}.library .item .manage button{padding:6px 10px;font-size:13px;background:transparent}.library .item .manage button:hover{background:#293647}.library .item .manage .danger:hover{background:#482d37}.library-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.library-tools input{flex:1;min-width:120px}.library-tools select{max-width:100%}@media(max-width:550px){.library .item{gap:5px;grid-template-columns:minmax(0,1fr) auto}.library .item .manage{flex-direction:column;gap:0}.library .item .manage button{min-height:36px;padding:4px 9px}}:root{color-scheme:dark}body{background:#10151e;color:#e2e8f0}input,textarea,select{background:#151e2b;color:#e2e8f0}input::placeholder,textarea::placeholder{color:#8d9bad}button.primary{color:#fff;background:#33765e}.stat strong,.answer-block .content{color:#8ed6b4}#curve text{fill:#a2afc0}#curve polyline{stroke:#65b995}progress{accent-color:#65b995}.tag{color:#a8d8c4}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.study:focus-visible{outline:2px solid #82b7ef;outline-offset:2px}button:hover:not(:disabled){filter:brightness(1.12)}::selection{background:#385b7c;color:#fff}</style><section id="login" class="panel"><h1>FlashCards</h1><p class="muted">登录你的私人记忆空间</p><form id="loginForm"><label>邮箱<input id="email" type="email" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录</button></form><p id="loginStatus" role="status"></p></section><main id="app" hidden><header><div><h1 style="letter-spacing:0">FlashCards</h1><small>每天一点，把知识留在心里。</small></div><div class="toolbar"><button class="primary" onclick="edit()">＋ 新建卡片</button><button onclick="logout()">退出</button></div></header><p class="status" id="status" role="status">正在连接共享存储…</p><div class="study" role="button" tabindex="0" onclick="flip()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flip()}"><small id="face">卡片正面</small><div class="content" id="question">暂无卡片</div><div id="answerBlock" class="answer-block" hidden><small>答案</small><div class="content" id="answerText"></div></div><small id="hint">点击卡片翻面</small></div><div class="ratings"><button class="primary" onclick="grade('good')" id="good">认识</button><button class="fuzzy" onclick="grade('fuzzy')" id="fuzzy">模糊</button><button class="danger" onclick="grade('again')" id="again">忘记</button></div><div class="actions"><button onclick="move(-1)">‹ 上一张</button><button id="editCurrent" onclick="editCurrentCard()" disabled>编辑卡片</button><button onclick="move(1)">下一张 ›</button></div><div class="stats"><div class="stat"><small>全部卡片</small><strong id="total">0</strong></div><div class="stat"><small>今日待复习</small><strong id="due">0</strong></div><div class="stat"><small>已熟悉</small><strong id="known">0</strong></div></div><div class="toolbar"><select id="category" aria-label="分类" onchange="resetStudy()"><option value="">全部分类</option></select><input id="search" type="search" placeholder="搜索卡片…" oninput="resetStudy()"><button onclick="onlyDue=!onlyDue;resetStudy()" id="mode">全部卡片</button></div><section class="panel" style="margin-bottom:16px"><h2>自动学习进度</h2><p id="taskProgress"></p><button id="practiceStart" onclick="startPractice()">继续学习巩固</button> <button id="practiceStop" onclick="stopPractice()" hidden>结束巩固</button></section><section class="panel"><h2>学习统计</h2><p id="daily"></p><div id="trend" aria-label="最近七天复习次数"></div><h2 style="font-size:17px;margin:8px 0 2px">记忆曲线（FSRS估算）</h2><svg id="curve" viewBox="0 0 340 140" role="img" aria-label="当前卡片估算记忆保持率"></svg><p id="memoryInfo" style="font-size:12px;margin:4px 0"></p><small>目标保持率90%，采用默认模型参数，并非实测记忆能力。每日记录通过云端同步，按设备当地日期归档。</small><h2>未来复习预测</h2><p id="forecast"></p><h2>学习日历</h2><div id="calendar" style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px"></div></section><div class="toolbar"><button onclick="renameCategory()">重命名分类</button><button onclick="document.getElementById('excel').click()">Excel 批量导入</button><button onclick="template()">下载导入模板</button><input type="file" id="excel" accept=".xlsx,.xls,.csv" hidden onchange="importExcel(this)"></div><details id="cardLibrary" class="panel"><summary style="cursor:pointer;font-size:20px;font-weight:600">我的卡片 <small id="count"></small></summary><div class="library-tools"><input type="search" id="librarySearch" placeholder="搜索问题或答案" oninput="libraryLimit=20;render()"><select id="libraryCategory" aria-label="管理分类" onchange="libraryLimit=20;render()"><option value="">全部分类</option></select></div><div class="library" id="library" style="margin-top:14px"></div><div class="actions"><button id="moreCards" onclick="libraryLimit+=20;render()">查看更多</button></div></details><p><button onclick="exportCards()">导出备份 JSON</button> <button onclick="document.getElementById('import').click()">导入备份</button><input type="file" id="import" accept=".json" hidden onchange="importCards(this)"></p><footer style="text-align:center;margin-top:28px;color:#a2afc0;font-size:12px">FlashCards · v2.3.2</footer></main><div class="overlay" id="overlay"><form class="modal" onsubmit="save(event)"><h2 id="modalTitle">新建卡片</h2><label for="front">正面 · 问题</label><textarea id="front" required></textarea><label for="back">背面 · 答案</label><textarea id="back" required></textarea><label for="cat">分类</label><input id="cat" list="cats" placeholder="例如：英语、历史、工作"><datalist id="cats"></datalist><div class="actions"><button type="button" onclick="closeEdit()">取消</button><button class="primary" type="submit">保存卡片</button></div></form></div><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
let task=null;let practice=null;let visited=[];let backPos=null;let libraryLimit=20;let cards=[],index=0,flipped=false,onlyDue=false,editing=null,busy=false;const $=id=>document.getElementById(id);const now=()=>Date.now();const isDue=c=>!c.due||c.due<=now();const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const uid=()=>crypto.randomUUID();function filtered(){let q=$('search').value.toLowerCase(),cat=$('category').value;return cards.filter(c=>(!cat||c.category===cat)&&(!q||[c.front,c.back,c.category].join(' ').toLowerCase().includes(q))&&(!onlyDue||isDue(c)))}function practicePool(){let q=$('search').value.toLowerCase(),cat=$('category').value;return cards.filter(c=>c.review_count>0&&(!cat||c.category===cat)&&(!q||[c.front,c.back,c.category].join(' ').toLowerCase().includes(q)))}
function studyCards(){return practice?practice.ids.filter(id=>!practice.done.has(id)).map(id=>cards.find(c=>c.id===id)).filter(Boolean):filtered().filter(isDue).sort((a,b)=>Number(!a.review_count)-Number(!b.review_count)||a.due-b.due)}
function startPractice(){visited=[];backPos=null;if(!statsReady||busy||sending||reviewQueue.length)return alert('请等待同步完成');let pool=practicePool();if(!pool.length)return alert('当前分类没有已学习的卡片');practice={ids:pool.map(c=>c.id),done:new Set()};index=0;flipped=false;render()}
function stopPractice(){visited=[];backPos=null;practice=null;index=0;flipped=false;render()}
function taskStatus(){let left=studyCards().length;$('taskProgress').textContent=!statsReady?'正在同步学习记录…':practice?(left?'自由巩固 · 已完成 '+practice.done.size+' / '+practice.ids.length+' 张':'本轮巩固已完成，可再学一轮'):left?'当前还有 '+left+' 张到期卡片':'当前到期卡片已学完';$('practiceStart').hidden=!!left||!practicePool().length;$('practiceStart').disabled=!statsReady||sending||reviewQueue.length>0;$('practiceStop').hidden=!practice}
function status(t,error=false){$('status').textContent=t;$('status').className='status'+(error?' error':'')}const db=window.supabase?.createClient('https://svnbctkpohcohxiewsjd.supabase.co','sb_publishable_T8KIYH9QJz1L0FLYyOsu6w_s8sIWxfh');
let user=null,reading=false,epoch=0,cloudHistory={},statsReady=false,pendingReview=null,reviewQueue=[],sending=false;
function check(error){if(error)throw error}
async function sync(){if(!user||busy||reading||sending||reviewQueue.length)return;reading=true;let generation=epoch, owner=user.id;try{let rows=[],offset=0;while(true){let {data,error}=await db.from('flashcards').select('*').order('created_at').order('id').range(offset,offset+499);check(error);rows.push(...data);if(data.length<500)break;offset+=500}if(!user||generation!==epoch||owner!==user.id||busy)return;let current=studyCards()[index]?.id;cards=rows.map(c=>({id:c.id,front:c.question,back:c.answer,category:c.category,level:c.level,review_count:c.review_count,due:Date.parse(c.next_review)||0,s:c.memory_s,d:c.memory_d,last:Date.parse(c.memory_at)||0}));try{await syncHistory(owner,generation);task=null;if(!user||generation!==epoch||owner!==user.id)return;status('● 卡片与学习统计已同步 · '+new Date().toLocaleTimeString())}catch(e){statsReady=false;status('卡片已同步；学习统计未连接，请检查数据库设置：'+e.message,true)}render(current)}catch(e){status('同步失败：'+e.message,true)}finally{reading=false}}
async function write(c){if(reviewQueue.some(p=>p.card===c.id))throw Error('请等待该卡片复习记录同步');if(!user)throw Error('请先登录');epoch++;if(c.deleted){let {error}=await db.from('flashcards').delete().eq('id',c.id).eq('user_id',user.id);check(error);return}let row={id:c.id,user_id:user.id,question:c.front,answer:c.back,category:c.category,level:c.level||0,review_count:c.review_count||0,next_review:new Date(c.due||Date.now()).toISOString(),updated_at:new Date().toISOString()};let {error}=await db.from('flashcards').upsert(row);check(error)}
async function logout(){if(busy||sending||reviewQueue.length)return alert("还有复习记录等待同步，请稍后退出");let {error}=await db.auth.signOut();if(error)alert(error.message)}
function sessionChanged(session){let next=session?.user||null;if(user?.id!==next?.id){epoch++;task=null;practice=null;visited=[];backPos=null;cloudHistory={};statsReady=false;pendingReview=null;reviewQueue=[];cards=[];index=0;flipped=false;closeEdit();$('search').value='';$('category').value='';render()}user=next;if(user){try{reviewQueue=JSON.parse(localStorage.getItem("shiyi-queue-"+user.id)||"[]")}catch{reviewQueue=[]}if(reviewQueue.length)setTimeout(flushReviews,0)}drawStats();$('login').hidden=!!user;$('app').hidden=!user;if(user)setTimeout(sync,0)}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();let btn=e.target.querySelector('button');btn.disabled=true;$('loginStatus').textContent='正在登录…';try{if(!db)throw Error('无法加载连接组件，请检查网络');let {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});check(error);$('password').value='';$('loginStatus').textContent=''}catch(e){$('loginStatus').textContent='登录失败：'+e.message}finally{btn.disabled=false}});
if(db){db.auth.onAuthStateChange((event,session)=>sessionChanged(session));}else{$('loginStatus').textContent='连接组件未加载，请检查网络后刷新。'}

function render(current){let cat=$('category').value;let cats=[...new Set(cards.map(c=>c.category))].sort();$('category').innerHTML='<option value="">全部分类</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');$('category').value=cats.includes(cat)?cat:'';$('cats').innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join('');$('total').textContent=cards.length;$('due').textContent=cards.filter(isDue).length;$('known').textContent=cards.filter(c=>c.level>=3).length;let lc=$('libraryCategory').value;$('libraryCategory').innerHTML='<option value="">全部分类</option>'+cats.map(c=>'<option>'+esc(c)+'</option>').join('');$('libraryCategory').value=cats.includes(lc)?lc:'';let lq=$('librarySearch').value.trim().toLowerCase();let libraryCards=cards.filter(c=>(!$('libraryCategory').value||c.category===$('libraryCategory').value)&&(!lq||[c.front,c.back,c.category].join(' ').toLowerCase().includes(lq)));let f=studyCards();taskStatus();if(current){let i=f.findIndex(c=>c.id===current);if(i>=0)index=i;else flipped=false}index=Math.max(0,Math.min(index,f.length-1));let c=backPos===null?f[index]:cards.find(x=>x.id===visited[backPos]);if(!c&&backPos!==null){backPos=null;c=f[index]}$('editCurrent').disabled=!c||busy;$('face').textContent=c?(backPos!==null?'回看 · ':practice?'自由巩固 · ':'问题 · ')+c.category:'开始你的记忆之旅';$('question').textContent=c?c.front:(statsReady?(practice?'本轮巩固已完成':'当前到期卡片已学完'):'正在同步卡片');$('answerBlock').hidden=!c||!flipped;$('answerText').textContent=c&&flipped?c.back:'';$('hint').textContent=c?(backPos!==null?'已学卡片 · 点击翻面':`${index+1} / ${f.length} · 点击翻面`):'可点击下方继续学习巩固';$('again').disabled=$('fuzzy').disabled=$('good').disabled=!c||!flipped||busy||backPos!==null;$('mode').textContent=onlyDue?'仅待复习':'全部卡片';$('count').textContent=`(${libraryCards.length})`;$('moreCards').hidden=libraryCards.length<=libraryLimit;$('library').innerHTML=$('cardLibrary').open?libraryCards.slice(0,libraryLimit).map(c=>`<article class="item"><div><p><b>${esc(c.front)}</b></p><div class="answer-preview">${esc(c.back)}</div><div class="meta"><span class="tag">${esc(c.category)}</span><span class="muted">${isDue(c)?'待复习':'下次 '+new Date(c.due).toLocaleDateString()}</span></div></div><div class="manage"><button data-id="${esc(c.id)}" onclick="edit(this.dataset.id)">编辑</button><button class="danger" data-id="${esc(c.id)}" onclick="removeCard(this.dataset.id)">删除</button></div></article>`).join('')||'<p class="muted">没有符合条件的卡片</p>':'';drawStats(c)}
function resetStudy(){visited=[];backPos=null;practice=null;libraryLimit=20;index=0;flipped=false;render()}function flip(){if(studyCards().length||backPos!==null){flipped=!flipped;render();let el=document.querySelector(".study");el.classList.remove("turn");void el.offsetWidth;el.classList.add("turn")}}function move(n){visited=visited.filter(id=>cards.some(c=>c.id===id));if(backPos!==null){backPos+=n;if(backPos>=visited.length)backPos=null;else backPos=Math.max(0,backPos)}else if(n<0&&index===0&&visited.length){backPos=visited.length-1}else{let l=studyCards().length;if(l)index=Math.max(0,Math.min(l-1,index+n))}flipped=false;render()}function persistQueue(owner,q){localStorage.setItem('shiyi-queue-'+owner,JSON.stringify(q))}
async function flushReviews(){if(sending||!user||!reviewQueue.length)return;let owner=user.id;sending=true;try{while(user?.id===owner&&reviewQueue.length){let p=reviewQueue[0];let args={p_card:p.card,p_event:p.event,p_day:p.day,p_rating:p.rating};let {error}=await db.rpc(p.task?'record_task_review':'record_flashcard_review',p.task?{...args,p_task:p.task}:args);check(error);if(user?.id!==owner)return;let rest=reviewQueue.slice(1);persistQueue(owner,rest);reviewQueue=rest}status('● 复习记录已保存')}catch(e){if(user?.id===owner)status('复习记录待同步（'+reviewQueue.length+'条），将自动重试：'+e.message,true)}finally{sending=false;if(user?.id===owner&&!reviewQueue.length)sync()}}
function grade(g){let c=studyCards()[index];if(!c||!flipped||busy||backPos!==null)return;if(!statsReady)return alert('请先等待云端统计连接');if(practice){let next=studyCards()[index+1]?.id;visited.push(c.id);practice.done.add(c.id);flipped=false;render(next);return}let p={card:c.id,rating:g,event:uid(),day:dayKey(),task:null};try{let q=[...reviewQueue,p];persistQueue(user.id,q);reviewQueue=q}catch(e){return alert('无法保存待同步记录，请检查浏览器存储空间')}visited.push(c.id);epoch++;let next=studyCards()[index+1]?.id;Object.assign(c,{review_count:(c.review_count||0)+1,due:now()+86400000});let v=cloudHistory[p.day]||{n:0,g:0};v.n++;v.g+=Number(g==='good');cloudHistory[p.day]=v;flipped=false;render(next);status('正在后台保存复习记录（'+reviewQueue.length+'条）');flushReviews()}function editCurrentCard(){let c=backPos===null?studyCards()[index]:cards.find(x=>x.id===visited[backPos]);if(c&&!busy)edit(c.id)}function edit(id){editing=cards.find(c=>c.id===id)||null;$('modalTitle').textContent=editing?'编辑卡片':'新建卡片';$('front').value=editing?.front||'';$('back').value=editing?.back||'';$('cat').value=editing?.category||'';$('overlay').classList.add('open');$('front').focus()}function closeEdit(){$('overlay').classList.remove('open')}async function save(e){e.preventDefault();if(busy)return;busy=true;try{let front=$('front').value.trim(),back=$('back').value.trim();if(!front||!back)throw Error();if(editing){let id=editing.id,category=$('cat').value.trim()||'未分类';epoch++;let {error}=await db.from('flashcards').update({question:front,answer:back,category,updated_at:new Date().toISOString()}).eq('id',id).eq('user_id',user.id);check(error);let c=cards.find(x=>x.id===id);if(c)Object.assign(c,{front,back,category});render(id)}else await write({...editing,id:editing?.id||uid(),front,back,category:$('cat').value.trim()||'未分类',level:editing?.level||0,review_count:editing?.review_count||0,due:editing?.due||0});closeEdit()}catch{alert('未保存，请检查输入或网络后重试')}finally{busy=false;await sync()}}async function removeCard(id){if(reviewQueue.some(p=>p.card===id))return alert('请等待该卡片的复习记录同步后再删除');if(busy||!confirm('确定删除这张卡片？'))return;busy=true;try{await write({id,deleted:true})}catch{alert('删除失败')}finally{busy=false;await sync()}}function exportCards(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(cards,null,2)],{type:'application/json'}));a.download='拾忆备份.json';a.click();URL.revokeObjectURL(a.href)}async function importCards(el){if(busy||!el.files.length)return;busy=true;try{let a=JSON.parse(await el.files[0].text());if(!Array.isArray(a)||!a.every(c=>typeof c.front==='string'&&typeof c.back==='string'&&typeof c.category==='string'))throw Error();if(!confirm('导入 '+a.length+' 张卡片？相同ID将覆盖。'))return;for(let c of a)await write({id:typeof c.id==='string'&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(c.id)?c.id:uid(),front:c.front,back:c.back,category:c.category,level:Math.max(0,Math.min(6,Math.trunc(Number(c.level)||0))),review_count:Math.max(0,Math.trunc(Number(c.review_count)||0)),due:Number(c.due)||0});await sync()}catch{alert('导入失败，部分卡片可能已保存')}finally{el.value='';busy=false;await sync()}}function dayKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function history(){return cloudHistory}
async function syncHistory(owner,generation){
 let key='shiyi-review-'+owner,legacy={};try{legacy=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
 let entries=Object.entries(legacy).filter(([d,v])=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&Number.isSafeInteger(v?.n)&&v.n>0&&Number.isSafeInteger(v.g)&&v.g>=0&&v.g<=v.n);
 if(entries.length){let device=localStorage.getItem('shiyi-migration-device');if(!device){device=uid();localStorage.setItem('shiyi-migration-device',device)}let rows=entries.map(([d,v])=>({user_id:owner,event_id:'legacy:'+device+':'+d,study_day:d,attempts:v.n,remembered:v.g,rating:'legacy'}));for(let i=0;i<rows.length;i+=200){let {error}=await db.from('review_logs').upsert(rows.slice(i,i+200),{onConflict:'user_id,event_id',ignoreDuplicates:true});check(error)}}
 let h={},offset=0;while(true){let {data,error}=await db.from('review_logs').select('study_day,attempts,remembered').eq('user_id',owner).order('event_id').range(offset,offset+499);check(error);for(let row of data){let v=h[row.study_day]||{n:0,g:0};v.n+=row.attempts;v.g+=row.remembered;h[row.study_day]=v}if(data.length<500)break;offset+=500}
 if(user?.id===owner&&generation===epoch){cloudHistory=h;statsReady=true}
}
function drawStats(c){let h=history(),v=h[dayKey()]||{n:0,g:0};$('daily').textContent=!statsReady?'学习统计尚未连接云端':'今日复习 '+v.n+' 次 · 记住率 '+(v.n?Math.round(v.g/v.n*100)+'%':'暂无') ;let a=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let k=dayKey(d);return [k.slice(5),h[k]?.n||0]});let max=Math.max(1,...a.map(x=>x[1]));$('trend').innerHTML=a.map(([k,n])=>'<div>'+n+'<i style="height:'+Math.max(2,n/max*105)+'px"></i>'+k+'</div>').join('');let interval=c?.s||0,pts=Array.from({length:61},(_,i)=>(30+i*5)+','+(15+100*(1-Math.pow(1+19/81*(i/2)/Math.max(.01,interval),-.5)))).join(' ');$('memoryInfo').textContent=c?.s?'难度 '+c.d.toFixed(1)+' / 10 · 稳定性 '+c.s.toFixed(1)+' 天':'尚未建立记忆模型';$('forecast').textContent=[7,30].map(n=>'未来'+n+'天：'+cards.filter(c=>c.review_count&&c.due>now()&&c.due<=now()+n*86400000).length+'张').join(' · ');$('calendar').innerHTML=Array.from({length:28},(_,i)=>{let d=new Date();d.setDate(d.getDate()-27+i);let k=dayKey(d),n=h[k]?.n||0;return '<span title="'+k+'：'+n+'次" style="text-align:center;padding:6px;border-radius:6px;background:'+(n?'#315b49':'#293647')+'">'+k.slice(5)+'</span>'}).join('');$('curve').innerHTML='<path d="M30 15V115H330" fill="none" stroke="#71849b"/><text x="0" y="15" font-size="10">100%</text><text x="8" y="115" font-size="10">0%</text><text x="30" y="132" font-size="10">0天</text><text x="300" y="132" font-size="10">30天</text>'+(c?.s?'<polyline points="'+pts+'" fill="none" stroke="#33765e" stroke-width="2.5"/>':'<text x="100" y="65" font-size="12">请选择卡片</text>')}
async function renameCategory(){let old=$('category').value;if(!old||busy)return alert('请先选择要重命名的分类');let name=prompt('新分类名称',old)?.trim();if(!name||name===old)return;busy=true;try{for(let c of cards.filter(c=>c.category===old))await write({...c,category:name})}catch(e){alert('部分修改可能失败：'+e.message)}finally{busy=false;await sync();$('category').value=name;resetStudy()}}
function template(){if(!window.XLSX)return alert('Excel组件未加载');let w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([['问题','答案','分类'],['元朝建立于哪一年？','1271年','历史']]),'卡片');XLSX.writeFile(w,'记忆卡片导入模板.xlsx')}
async function importExcel(el){if(busy||!user||!el.files.length)return;busy=true;let n=0;try{if(!window.XLSX)throw Error('Excel组件未加载');let w=XLSX.read(await el.files[0].arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{header:1,defval:'',raw:false});let header=(rows.shift()||[]).map(x=>String(x).trim()),find=names=>header.findIndex(x=>names.includes(x.toLowerCase())),f=find(['问题','正面','front','question']),b=find(['答案','背面','back','answer']),k=find(['分类','category']);if(f<0||b<0)throw Error('首行必须包含问题、答案列');let list=rows.map(r=>({front:String(r[f]||'').trim(),back:String(r[b]||'').trim(),category:String(r[k]||'未分类').trim()||'未分类'})).filter(c=>c.front&&c.back);let seen=new Set(cards.map(c=>JSON.stringify([c.front,c.back,c.category])));list=list.filter(c=>{let key=JSON.stringify([c.front,c.back,c.category]);if(seen.has(key))return false;seen.add(key);return true});if(!list.length)return alert('没有可导入的新卡片');if(!confirm('导入 '+list.length+' 张新卡片？空白及重复行已跳过。'))return;for(let c of list){await write({...c,id:uid(),level:0,review_count:0,due:0});n++}alert('成功导入 '+n+' 张')}catch(e){alert('已导入 '+n+' 张；'+e.message)}finally{busy=false;el.value='';await sync()}}
$('cardLibrary').addEventListener('toggle',()=>{if(!$('cardLibrary').open)libraryLimit=20;render()});sync();setInterval(()=>{if(reviewQueue.length)flushReviews();else sync()},5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});</script></html>
