l{background:white;width:min(500px,100%);padding:24px;border-radius:22px;max-height:90vh;overflow:auto}.modal label{display:block;margin:12px 0 5px}.modal input{width:100%}.status{font-size:12px;color:#71847b}.error{color:#a54d4d}@media(max-width:550px){main{padding:20px 14px}.stat{padding:12px}.stat strong{font-size:24px}.study{min-height:240px}.study .content{font-size:22px}h1{font-size:26px}} #login{max-width:420px;margin:12vh auto;padding:28px}#login input{width:100%;margin:7px 0 14px}#login button{width:100%}#app[hidden],#login[hidden]{display:none!important}.item small{white-space:pre-wrap}.overlay{z-index:5}  .study{perspective:1000px}.study.turn{animation:turn .42s ease}@keyframes turn{0%{transform:rotateY(-85deg);opacity:.35}100%{transform:rotateY(0);opacity:1}}@media(prefers-reduced-motion:reduce){.study.turn{animation:none}}#trend{display:flex;align-items:end;gap:8px;height:150px;margin:16px 0}#trend>div{flex:1;text-align:center;font-size:11px;min-width:0}#trend i{display:block;background:#57977b;border-radius:5px 5px 0 0;margin:auto;width:70%}#curve{display:block;width:100%;max-width:340px;height:110px;margin:4px auto}@media(max-width:550px){header{flex-wrap:wrap}header .toolbar{margin:5px 0;width:100%}button{min-height:44px}.toolbar input[type=search]{flex-basis:100%}.actions button{flex:1 1 42%}.library{grid-template-columns:1fr}#login{margin:8vh 14px}.study{padding:22px 14px}.panel{padding:15px}} .answer-block{width:100%;border-top:1px solid #cbdcd0;padding-top:14px;margin-top:4px}.answer-block[hidden]{display:none}.answer-block .content{color:#316a54;margin:12px auto}.ratings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}.ratings button{min-height:48px}.ratings .fuzzy{background:#fff0ce;color:#805a15}.ratings .danger{background:#f8e4e4;color:#a54d4d}</style><section id="login" class="panel"><h1>FlashCards</h1><p class="muted">登录你的私人记忆空间</p><form id="loginForm"><label>邮箱<input id="email" type="email" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录</button></form><p id="loginStatus" role="status"></p></section><main id="app" hidden><header><div><h1 style="letter-spacing:0">FlashCards</h1><small>每天一点，把知识留在心里。</small></div><div class="toolbar"><button class="primary" onclick="edit()">＋ 新建卡片</button><button onclick="logout()">退出</button></div></header><p class="status" id="status" role="status">正在连接共享存储…</p><div class="stats"><div class="stat"><small>全部卡片</small><strong id="total">0</strong></div><div class="stat"><small>今日待复习</small><strong id="due">0</strong></div><div class="stat"><small>已熟悉</small><strong id="known">0</strong></div></div><div class="toolbar"><select id="category" aria-label="分类" onchange="resetStudy()"><option value="">全部分类</option></select><input id="search" type="search" placeholder="搜索卡片…" oninput="resetStudy()"><button onclick="onlyDue=!onlyDue;resetStudy()" id="mode">全部卡片</button></div><section class="panel" style="margin-bottom:16px"><h2>每日学习任务</h2><div class="toolbar"><label>复习上限 <select id="taskSize"><option>10</option><option selected>20</option><option>30</option><option>50</option></select></label><label>新学上限 <select id="newSize"><option>0</option><option>5</option><option selected>10</option><option>20</option></select></label><button class="primary" onclick="startTask()">开始学习任务</button><button onclick="consolidate()">巩固模糊/忘记卡片（一次）</button></div><p id="taskProgress">请选择分类或直接开始学习</p><progress id="taskBar" value="0" max="1" style="width:100%"></progress></section><div class="study" role="button" tabindex="0" onclick="flip()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flip()}"><small id="face">卡片正面</small><div class="content" id="question">暂无卡片</div><div id="answerBlock" class="answer-block" hidden><small>答案</small><div class="content" id="answerText"></div></div><small id="hint">点击卡片翻面</small></div><div class="ratings"><button class="primary" onclick="grade('good')" id="good">认识</button><button class="fuzzy" onclick="grade('fuzzy')" id="fuzzy">模糊</button><button class="danger" onclick="grade('again')" id="again">忘记</button></div><div class="actions"><button onclick="move(-1)">‹ 上一张</button><button onclick="move(1)">下一张 ›</button></div><section class="panel"><h2>学习统计</h2><p id="daily"></p><div id="trend" aria-label="最近七天复习次数"></div><h2 style="font-size:17px;margin:8px 0 2px">记忆曲线（FSRS估算）</h2><svg id="curve" viewBox="0 0 340 140" role="img" aria-label="当前卡片估算记忆保持率"></svg><p id="memoryInfo" style="font-size:12px;margin:4px 0"></p><small>目标保持率90%，采用默认模型参数，并非实测记忆能力。每日记录通过云端同步，按设备当地日期归档。</small><h2>未来复习预测</h2><p id="forecast"></p><h2>学习日历</h2><div id="calendar" style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px"></div></section><div class="toolbar"><button onclick="renameCategory()">重命名分类</button><button onclick="document.getElementById('excel').click()">Excel 批量导入</button><button onclick="template()">下载导入模板</button><input type="file" id="excel" accept=".xlsx,.xls,.csv" hidden onchange="importExcel(this)"></div><details id="cardLibrary" class="panel"><summary style="cursor:pointer;font-size:20px;font-weight:600">我的卡片 <small id="count"></small> · 展开管理</summary><div class="library" id="library" style="margin-top:14px"></div><div class="actions"><button id="moreCards" onclick="libraryLimit+=20;render()">查看更多</button></div></details><p><button onclick="exportCards()">导出备份 JSON</button> <button onclick="document.getElementById('import').click()">导入备份</button><input type="file" id="import" accept=".json" hidden onchange="importCards(this)"></p><footer style="text-align:center;margin-top:32px;padding:16px 0;border-top:1px solid #d9e3da;color:#71847b;font-size:12px">拾忆 · v2.0.1</footer><footer style="text-align:center;margin-top:28px;color:#71847b;font-size:12px">FlashCards · v2.1.0</footer></main><div class="overlay" id="overlay"><form class="modal" onsubmit="save(event)"><h2 id="modalTitle">新建卡片</h2><label for="front">正面 · 问题</label><textarea id="front" required></textarea><label for="back">背面 · 答案</label><textarea id="back" required></textarea><label for="cat">分类</label><input id="cat" list="cats" placeholder="例如：英语、历史、工作"><datalist id="cats"></datalist><div class="actions"><button type="button" onclick="closeEdit()">取消</button><button class="primary" type="submit">保存卡片</button></div></form></div><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
let task=null;let libraryLimit=20;let cards=[],index=0,flipped=false,onlyDue=false,editing=null,busy=false;const $=id=>document.getElementById(id);const now=()=>Date.now();const isDue=c=>!c.due||c.due<=now();const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const uid=()=>crypto.randomUUID();function filtered(){let q=$('search').value.toLowerCase(),cat=$('category').value;return cards.filter(c=>(!cat||c.category===cat)&&(!q||[c.front,c.back,c.category].join(' ').toLowerCase().includes(q))&&(!onlyDue||isDue(c)))}function studyCards(){return task?task.ids.filter(id=>!task.done[id]).map(id=>cards.find(c=>c.id===id)).filter(Boolean):[]}
async function startTask(){if(!statsReady||busy||sending||reviewQueue.length)return alert('请等待云端同步完成');if(task&&studyCards().length&&!confirm('结束当前任务并开始新任务？'))return;let limit=Number($('taskSize').value),pool=filtered().filter(isDue).sort((a,b)=>Number(!a.review_count)-Number(!b.review_count)||a.due-b.due);let t={task_id:uid(),ids:[...pool.filter(c=>c.review_count).slice(0,limit),...pool.filter(c=>!c.review_count).slice(0,Number($('newSize').value))].map(c=>c.id),done:{},phase:'main'};busy=true;epoch++;try{let {error}=await db.from('study_tasks').upsert({user_id:user.id,...t});check(error);task=t;index=0;flipped=false;render()}catch(e){alert('任务创建失败：'+e.message)}finally{busy=false;await sync()}}
async function consolidate(){if(!statsReady||busy||sending||reviewQueue.length)return alert('请等待同步');if(!task||studyCards().length||task.phase!=='main')return alert('请先完成主任务，每轮只允许一次巩固');let ids=task.ids.filter(id=>['fuzzy','again'].includes(task.done[id])&&cards.some(c=>c.id===id));if(!ids.length)return alert('没有需要巩固的卡片');busy=true;epoch++;try{let t={task_id:uid(),ids,done:{},phase:'consolidation'};let {error}=await db.from('study_tasks').upsert({user_id:user.id,...t});check(error);task=t;index=0;flipped=false;render()}catch(e){alert(e.message)}finally{busy=false;await sync()}}
function taskStatus(){let n=task?Object.keys(task.done).length:0,total=task?.ids.length||0,left=studyCards().length;let ratings=Object.values(task?.done||{});$('taskBar').max=total||1;$('taskBar').value=n;$('taskProgress').textContent=!task?'请选择分类或直接开始学习':!total?'当前没有到期卡片':!left?'本轮任务结束 · 已学习 '+n+'/'+total+' 张 · 认识 '+ratings.filter(x=>x==='good').length+' · 模糊 '+ratings.filter(x=>x==='fuzzy').length+' · 忘记 '+ratings.filter(x=>x==='again').length:'已完成 '+n+' / '+total+' 张 · 剩余 '+left+' 张'}
function status(t,error=false){$('status').textContent=t;$('status').className='status'+(error?' error':'')}const db=window.supabase?.createClient('https://svnbctkpohcohxiewsjd.supabase.co','sb_publishable_T8KIYH9QJz1L0FLYyOsu6w_s8sIWxfh');
let user=null,reading=false,epoch=0,cloudHistory={},statsReady=false,pendingReview=null,reviewQueue=[],sending=false;
function check(error){if(error)throw error}
async function sync(){if(!user||busy||reading||sending||reviewQueue.length)return;reading=true;let generation=epoch, owner=user.id;try{let rows=[],offset=0;while(true){let {data,error}=await db.from('flashcards').select('*').order('created_at').order('id').range(offset,offset+499);check(error);rows.push(...data);if(data.length<500)break;offset+=500}if(!user||generation!==epoch||owner!==user.id||busy)return;let current=studyCards()[index]?.id;cards=rows.map(c=>({id:c.id,front:c.question,back:c.answer,category:c.category,level:c.level,review_count:c.review_count,due:Date.parse(c.next_review)||0,s:c.memory_s,d:c.memory_d,last:Date.parse(c.memory_at)||0}));try{await syncHistory(owner,generation);let {data:t,error:te}=await db.from('study_tasks').select('task_id,ids,done,phase').eq('user_id',owner).maybeSingle();check(te);if(user?.id===owner&&generation===epoch){if(task?.task_id!==t?.task_id||current&&t?.done?.[current]){index=0;flipped=false;current=null}task=t}if(!user||generation!==epoch||owner!==user.id)return;status('● 卡片与学习统计已同步 · '+new Date().toLocaleTimeString())}catch(e){statsReady=false;status('卡片已同步；学习统计未连接，请检查数据库设置：'+e.message,true)}render(current)}catch(e){status('同步失败：'+e.message,true)}finally{reading=false}}
async function write(c){if(reviewQueue.some(p=>p.card===c.id))throw Error('请等待该卡片复习记录同步');if(!user)throw Error('请先登录');epoch++;if(c.deleted){let {error}=await db.from('flashcards').delete().eq('id',c.id).eq('user_id',user.id);check(error);return}let row={id:c.id,user_id:user.id,question:c.front,answer:c.back,category:c.category,level:c.level||0,review_count:c.review_count||0,next_review:new Date(c.due||Date.now()).toISOString(),updated_at:new Date().toISOString()};let {error}=await db.from('flashcards').upsert(row);check(error)}
async function logout(){if(busy||sending||reviewQueue.length)return alert("还有复习记录等待同步，请稍后退出");let {error}=await db.auth.signOut();if(error)alert(error.message)}
function sessionChanged(session){let next=session?.user||null;if(user?.id!==next?.id){epoch++;task=null;cloudHistory={};statsReady=false;pendingReview=null;reviewQueue=[];cards=[];index=0;flipped=false;closeEdit();$('search').value='';$('category').value='';render()}user=next;if(user){try{reviewQueue=JSON.parse(localStorage.getItem("shiyi-queue-"+user.id)||"[]")}catch{reviewQueue=[]}if(reviewQueue.length)setTimeout(flushReviews,0)}drawStats();$('login').hidden=!!user;$('app').hidden=!user;if(user)setTimeout(sync,0)}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();let btn=e.target.querySelector('button');btn.disabled=true;$('loginStatus').textContent='正在登录…';try{if(!db)throw Error('无法加载连接组件，请检查网络');let {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});check(error);$('password').value='';$('loginStatus').textContent=''}catch(e){$('loginStatus').textContent='登录失败：'+e.message}finally{btn.disabled=false}});
if(db){db.auth.onAuthStateChange((event,session)=>sessionChanged(session));}else{$('loginStatus').textContent='连接组件未加载，请检查网络后刷新。'}

function render(current){let cat=$('category').value;let cats=[...new Set(cards.map(c=>c.category))].sort();$('category').innerHTML='<option value="">全部分类</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');$('category').value=cats.includes(cat)?cat:'';$('cats').innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join('');$('total').textContent=cards.length;$('due').textContent=cards.filter(isDue).length;$('known').textContent=cards.filter(c=>c.level>=3).length;let libraryCards=filtered();let f=studyCards();taskStatus();if(current){let i=f.findIndex(c=>c.id===current);if(i>=0)index=i;else flipped=false}index=Math.max(0,Math.min(index,f.length-1));let c=f[index];$('face').textContent=c?'问题 · '+c.category:'开始你的记忆之旅';$('question').textContent=c?c.front:(task?'本轮学习已结束':'点击开始学习任务');$('answerBlock').hidden=!c||!flipped;$('answerText').textContent=c&&flipped?c.back:'';$('hint').textContent=c?`${index+1} / ${f.length} · 点击翻面`:'到期后再复习，不必反复学习';$('again').disabled=$('fuzzy').disabled=$('good').disabled=!c||!flipped||busy;$('mode').textContent=onlyDue?'仅待复习':'全部卡片';$('count').textContent=`(${libraryCards.length})`;$('moreCards').hidden=libraryCards.length<=libraryLimit;$('library').innerHTML=$('cardLibrary').open?libraryCards.slice(0,libraryLimit).map(c=>`<article class="item"><span class="tag">${esc(c.category)}</span><p><b>${esc(c.front)}</b></p><small>${esc(c.back)}</small><p class="muted">${isDue(c)?'待复习':'下次：'+new Date(c.due).toLocaleString()}</p><button data-id="${esc(c.id)}" onclick="cardHistory(this.dataset.id)">记忆历史</button> <button data-id="${esc(c.id)}" onclick="edit(this.dataset.id)">编辑</button> <button class="danger" data-id="${esc(c.id)}" onclick="removeCard(this.dataset.id)">删除</button></article>`).join(''):'';drawStats(c)}
function resetStudy(){libraryLimit=20;index=0;flipped=false;render()}function flip(){if(studyCards().length){flipped=!flipped;render();let el=document.querySelector(".study");el.classList.remove("turn");void el.offsetWidth;el.classList.add("turn")}}function move(n){let l=studyCards().length;if(l){index=Math.max(0,Math.min(l-1,index+n));flipped=false;render()}}function persistQueue(owner,q){localStorage.setItem('shiyi-queue-'+owner,JSON.stringify(q))}
async function flushReviews(){if(sending||!user||!reviewQueue.length)return;let owner=user.id;sending=true;try{while(user?.id===owner&&reviewQueue.length){let p=reviewQueue[0];let args={p_card:p.card,p_event:p.event,p_day:p.day,p_rating:p.rating};let {error}=await db.rpc(p.task?'record_task_review':'record_flashcard_review',p.task?{...args,p_task:p.task}:args);check(error);if(user?.id!==owner)return;let rest=reviewQueue.slice(1);persistQueue(owner,rest);reviewQueue=rest}status('● 复习记录已保存')}catch(e){if(user?.id===owner)status('复习记录待同步（'+reviewQueue.length+'条），将自动重试：'+e.message,true)}finally{sending=false;if(user?.id===owner&&!reviewQueue.length)sync()}}
function grade(g){let c=studyCards()[index];if(!c||!flipped||busy)return;if(!statsReady)return alert('请先等待云端统计连接');let p={card:c.id,rating:g,event:uid(),day:dayKey(),task:task.task_id};try{let q=[...reviewQueue,p];persistQueue(user.id,q);reviewQueue=q}catch(e){return alert('无法保存待同步记录，请检查浏览器存储空间')}epoch++;let next=studyCards()[index+1]?.id;Object.assign(c,{review_count:(c.review_count||0)+1,due:now()+86400000});let v=cloudHistory[p.day]||{n:0,g:0};v.n++;v.g+=Number(g==='good');cloudHistory[p.day]=v;task.done[c.id]=g;flipped=false;render(next);status('正在后台保存复习记录（'+reviewQueue.length+'条）');flushReviews()}async function cardHistory(id){let {data,error}=await db.from('review_logs').select('reviewed_at,rating').eq('user_id',user.id).eq('card_id',id).order('reviewed_at',{ascending:false}).limit(50);if(error)return alert(error.message);alert(data.length?data.map(x=>new Date(x.reviewed_at).toLocaleString()+' · '+({good:'认识',fuzzy:'模糊',again:'忘记'}[x.rating]||x.rating)).join('\n'):'暂无逐卡历史记录')}
function edit(id){editing=cards.find(c=>c.id===id)||null;$('modalTitle').textContent=editing?'编辑卡片':'新建卡片';$('front').value=editing?.front||'';$('back').value=editing?.back||'';$('cat').value=editing?.category||'';$('overlay').classList.add('open');$('front').focus()}function closeEdit(){$('overlay').classList.remove('open')}async function save(e){e.preventDefault();if(busy)return;busy=true;try{let front=$('front').value.trim(),back=$('back').value.trim();if(!front||!back)throw Error();await write({...editing,id:editing?.id||uid(),front,back,category:$('cat').value.trim()||'未分类',level:editing?.level||0,review_count:editing?.review_count||0,due:editing?.due||0});closeEdit()}catch{alert('未保存，请检查输入或网络后重试')}finally{busy=false;await sync()}}async function removeCard(id){if(task?.ids.includes(id)&&!task.done[id])return alert('请先完成或结束当前学习任务');if(reviewQueue.some(p=>p.card===id))return alert('请等待该卡片的复习记录同步后再删除');if(busy||!confirm('确定删除这张卡片？'))return;busy=true;try{await write({id,deleted:true})}catch{alert('删除失败')}finally{busy=false;await sync()}}function exportCards(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(cards,null,2)],{type:'application/json'}));a.download='拾忆备份.json';a.click();URL.revokeObjectURL(a.href)}async function importCards(el){if(busy||!el.files.length)return;busy=true;try{let a=JSON.parse(await el.files[0].text());if(!Array.isArray(a)||!a.every(c=>typeof c.front==='string'&&typeof c.back==='string'&&typeof c.category==='string'))throw Error();if(!confirm('导入 '+a.length+' 张卡片？相同ID将覆盖。'))return;for(let c of a)await write({id:typeof c.id==='string'&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(c.id)?c.id:uid(),front:c.front,back:c.back,category:c.category,level:Math.max(0,Math.min(6,Math.trunc(Number(c.level)||0))),review_count:Math.max(0,Math.trunc(Number(c.review_count)||0)),due:Number(c.due)||0});await sync()}catch{alert('导入失败，部分卡片可能已保存')}finally{el.value='';busy=false;await sync()}}function dayKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

async function syncHistory(owner,generation){
 let key='shiyi-review-'+owner,legacy={};try{legacy=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
 let entries=Object.entries(legacy).filter(([d,v])=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&Number.isSafeInteger(v?.n)&&v.n>0&&Number.isSafeInteger(v.g)&&v.g>=0&&v.g<=v.n);
 if(entries.length){let device=localStorage.getItem('shiyi-migration-device');if(!device){device=uid();localStorage.setItem('shiyi-migration-device',device)}let rows=entries.map(([d,v])=>({user_id:owner,event_id:'legacy:'+device+':'+d,study_day:d,attempts:v.n,remembered:v.g,rating:'legacy'}));for(let i=0;i<rows.length;i+=200){let {error}=await db.from('review_logs').upsert(rows.slice(i,i+200),{onConflict:'user_id,event_id',ignoreDuplicates:true});check(error)}}
 let h={},offset=0;while(true){let {data,error}=await db.from('review_logs').select('study_day,attempts,remembered').eq('user_id',owner).order('event_id').range(offset,offset+499);check(error);for(let row of data){let v=h[row.study_day]||{n:0,g:0};v.n+=row.attempts;v.g+=row.remembered;h[row.study_day]=v}if(data.length<500)break;offset+=500}
 if(user?.id===owner&&generation===epoch){cloudHistory=h;statsReady=true}
}
function drawStats(c){let h=history(),v=h[dayKey()]||{n:0,g:0};$('daily').textContent=!statsReady?'学习统计尚未连接云端':'今日复习 '+v.n+' 次 · 记住率 '+(v.n?Math.round(v.g/v.n*100)+'%':'暂无') ;let a=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let k=dayKey(d);return [k.slice(5),h[k]?.n||0]});let max=Math.max(1,...a.map(x=>x[1]));$('trend').innerHTML=a.map(([k,n])=>'<div>'+n+'<i style="height:'+Math.max(2,n/max*105)+'px"></i>'+k+'</div>').join('');let interval=c?.s||0,pts=Array.from({length:61},(_,i)=>(30+i*5)+','+(15+100*(1-Math.pow(1+19/81*(i/2)/Math.max(.01,interval),-.5)))).join(' ');$('memoryInfo').textContent=c?.s?'难度 '+c.d.toFixed(1)+' / 10 · 稳定性 '+c.s.toFixed(1)+' 天':'尚未建立记忆模型';$('forecast').textContent=[7,30].map(n=>'未来'+n+'天：'+cards.filter(c=>c.review_count&&c.due>now()&&c.due<=now()+n*86400000).length+'张').join(' · ');$('calendar').innerHTML=Array.from({length:28},(_,i)=>{let d=new Date();d.setDate(d.getDate()-27+i);let k=dayKey(d),n=h[k]?.n||0;return '<span title="'+k+'：'+n+'次" style="text-align:center;padding:6px;border-radius:6px;background:'+(n?'#d1e8d8':'#f0f2ef')+'">'+k.slice(5)+'</span>'}).join('');$('curve').innerHTML='<path d="M30 15V115H330" fill="none" stroke="#9aada2"/><text x="0" y="15" font-size="10">100%</text><text x="8" y="115" font-size="10">0%</text><text x="30" y="132" font-size="10">0天</text><text x="300" y="132" font-size="10">30天</text>'+(c?.s?'<polyline points="'+pts+'" fill="none" stroke="#316a54" stroke-width="2.5"/>':'<text x="100" y="65" font-size="12">请选择卡片</text>')}
async function renameCategory(){let old=$('category').value;if(!old||busy)return alert('请先选择要重命名的分类');let name=prompt('新分类名称',old)?.trim();if(!name||name===old)return;busy=true;try{for(let c of cards.filter(c=>c.category===old))await write({...c,category:name})}catch(e){alert('部分修改可能失败：'+e.message)}finally{busy=false;await sync();$('category').value=name;resetStudy()}}
