<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾忆 · 记忆卡片</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f2;color:#253d36;font:16px/1.6 system-ui,-apple-system,sans-serif}main{max-width:1000px;margin:auto;padding:28px 20px 60px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:30px;margin:0;letter-spacing:4px}h2{font-size:22px;margin:8px 0}small,.muted{color:#71847b}button,input,textarea,select{font:inherit}button{border:0;border-radius:12px;padding:10px 16px;background:#e4ede6;color:#315b49;cursor:pointer}button.primary{background:#316a54;color:white}button.danger{color:#a54d4d}button:disabled{opacity:.45;cursor:default}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}.stat,.panel{background:white;border:1px solid #e2e9e2;border-radius:20px;padding:20px}.stat strong{display:block;font-size:30px;color:#316a54}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.toolbar{margin:20px 0}input,textarea,select{border:1px solid #d9e3da;border-radius:12px;background:white;padding:11px;color:inherit;min-width:0}input[type=search]{flex:1}textarea{width:100%;min-height:95px;resize:vertical}.study{background:linear-gradient(135deg,#fff,#e9f2e9);min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:35px 24px;border-radius:24px;box-shadow:0 8px 26px #203f2710;cursor:pointer}.study .content{font-size:25px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%;margin:20px 0}.actions{justify-content:center;margin:18px 0}.library{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.item{background:white;border:1px solid #e2e9e2;padding:18px;border-radius:16px;overflow-wrap:anywhere}.item p{white-space:pre-wrap;margin:8px 0}.tag{font-size:12px;background:#eaf1e7;padding:4px 10px;border-radius:99px}.overlay{position:fixed;inset:0;background:#17372c66;display:none;align-items:center;justify-content:center;padding:16px}.overlay.open{display:flex}.modal{background:white;width:min(500px,100%);padding:24px;border-radius:22px;max-height:90vh;overflow:auto}.modal label{display:block;margin:12px 0 5px}.modal input{width:100%}.status{font-size:12px;color:#71847b}.error{color:#a54d4d}@media(max-width:550px){main{padding:20px 14px}.stat{padding:12px}.stat strong{font-size:24px}.study{min-height:240px}.study .content{font-size:22px}h1{font-size:26px}} #login{max-width:420px;margin:12vh auto;padding:28px}#login input{width:100%;margin:7px 0 14px}#login button{width:100%}#app[hidden],#login[hidden]{display:none!important}.item small{white-space:pre-wrap}.overlay{z-index:5} </style><section id="login" class="panel"><h1>拾忆 ✳</h1><p class="muted">登录你的私人记忆空间</p><form id="loginForm"><label>邮箱<input id="email" type="email" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录</button></form><p id="loginStatus" role="status"></p></section><main id="app" hidden><header><div><h1>拾忆 <span style="font-size:16px;letter-spacing:0">✳</span></h1><small>每天一点，把知识留在心里。</small></div><div class="toolbar"><button class="primary" onclick="edit()">＋ 新建卡片</button><button onclick="logout()">退出</button></div></header><p class="status" id="status" role="status">正在连接共享存储…</p><div class="stats"><div class="stat"><small>全部卡片</small><strong id="total">0</strong></div><div class="stat"><small>今日待复习</small><strong id="due">0</strong></div><div class="stat"><small>已熟悉</small><strong id="known">0</strong></div></div><div class="toolbar"><select id="category" aria-label="分类" onchange="resetStudy()"><option value="">全部分类</option></select><input id="search" type="search" placeholder="搜索卡片…" oninput="resetStudy()"><button onclick="onlyDue=!onlyDue;resetStudy()" id="mode">全部卡片</button></div><div class="study" role="button" tabindex="0" onclick="flip()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flip()}"><small id="face">卡片正面</small><div class="content" id="question">暂无卡片</div><small id="hint">点击卡片翻面</small></div><div class="actions"><button onclick="move(-1)">‹ 上一张</button><button onclick="grade(false)" id="again">再学一次</button><button class="primary" onclick="grade(true)" id="good">记住了</button><button onclick="move(1)">下一张 ›</button></div><h2>我的卡片 <small id="count"></small></h2><div class="library" id="library"></div><p><button onclick="exportCards()">导出备份 JSON</button> <button onclick="document.getElementById('import').click()">导入备份</button><input type="file" id="import" accept=".json" hidden onchange="importCards(this)"></p></main><div class="overlay" id="overlay"><form class="modal" onsubmit="save(event)"><h2 id="modalTitle">新建卡片</h2><label for="front">正面 · 问题</label><textarea id="front" required></textarea><label for="back">背面 · 答案</label><textarea id="back" required></textarea><label for="cat">分类</label><input id="cat" list="cats" placeholder="例如：英语、历史、工作"><datalist id="cats"></datalist><div class="actions"><button type="button" onclick="closeEdit()">取消</button><button class="primary" type="submit">保存卡片</button></div></form></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
let cards=[],index=0,flipped=false,onlyDue=false,editing=null,busy=false;const $=id=>document.getElementById(id);const now=()=>Date.now();const isDue=c=>!c.due||c.due<=now();const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const uid=()=>crypto.randomUUID();function filtered(){let q=$('search').value.toLowerCase(),cat=$('category').value;return cards.filter(c=>(!cat||c.category===cat)&&(!q||[c.front,c.back,c.category].join(' ').toLowerCase().includes(q))&&(!onlyDue||isDue(c)))}function status(t,error=false){$('status').textContent=t;$('status').className='status'+(error?' error':'')}const db=window.supabase?.createClient('https://svnbctkpohcohxiewsjd.supabase.co','sb_publishable_T8KIYH9QJz1L0FLYyOsu6w_s8sIWxfh');
let user=null,reading=false,epoch=0;
function check(error){if(error)throw error}
async function sync(){if(!user||busy||reading)return;reading=true;let generation=epoch, owner=user.id;try{let rows=[],offset=0;while(true){let {data,error}=await db.from('flashcards').select('*').order('created_at').order('id').range(offset,offset+499);check(error);rows.push(...data);if(data.length<500)break;offset+=500}if(!user||generation!==epoch||owner!==user.id||busy)return;let current=filtered()[index]?.id;cards=rows.map(c=>({id:c.id,front:c.question,back:c.answer,category:c.category,level:c.level,review_count:c.review_count,due:Date.parse(c.next_review)||0}));render(current);status('● 云端已同步 · '+new Date().toLocaleTimeString())}catch(e){status('同步失败：'+e.message,true)}finally{reading=false}}
async function write(c){if(!user)throw Error('请先登录');epoch++;if(c.deleted){let {error}=await db.from('flashcards').delete().eq('id',c.id).eq('user_id',user.id);check(error);return}let row={id:c.id,user_id:user.id,question:c.front,answer:c.back,category:c.category,level:c.level||0,review_count:c.review_count||0,next_review:new Date(c.due||Date.now()).toISOString(),updated_at:new Date().toISOString()};let {error}=await db.from('flashcards').upsert(row);check(error)}
async function logout(){if(busy)return;let {error}=await db.auth.signOut();if(error)alert(error.message)}
function sessionChanged(session){let next=session?.user||null;if(user?.id!==next?.id){epoch++;cards=[];index=0;flipped=false;closeEdit();$('search').value='';$('category').value='';render()}user=next;$('login').hidden=!!user;$('app').hidden=!user;if(user)setTimeout(sync,0)}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();let btn=e.target.querySelector('button');btn.disabled=true;$('loginStatus').textContent='正在登录…';try{if(!db)throw Error('无法加载连接组件，请检查网络');let {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});check(error);$('password').value='';$('loginStatus').textContent=''}catch(e){$('loginStatus').textContent='登录失败：'+e.message}finally{btn.disabled=false}});
if(db){db.auth.onAuthStateChange((event,session)=>sessionChanged(session));}else{$('loginStatus').textContent='连接组件未加载，请检查网络后刷新。'}

function render(current){let cat=$('category').value;let cats=[...new Set(cards.map(c=>c.category))].sort();$('category').innerHTML='<option value="">全部分类</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');$('category').value=cats.includes(cat)?cat:'';$('cats').innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join('');$('total').textContent=cards.length;$('due').textContent=cards.filter(isDue).length;$('known').textContent=cards.filter(c=>c.level>=3).length;let f=filtered();if(current){let i=f.findIndex(c=>c.id===current);if(i>=0)index=i;else flipped=false}index=Math.max(0,Math.min(index,f.length-1));let c=f[index];$('face').textContent=c?(flipped?'答案':'问题')+' · '+c.category:'开始你的记忆之旅';$('question').textContent=c?(flipped?c.back:c.front):'暂无符合条件的卡片';$('hint').textContent=c?`${index+1} / ${f.length} · 点击翻面`:'点击右上角新建卡片';$('again').disabled=$('good').disabled=!c||!flipped||busy;$('mode').textContent=onlyDue?'仅待复习':'全部卡片';$('count').textContent=`(${f.length})`;$('library').innerHTML=f.map(c=>`<article class="item"><span class="tag">${esc(c.category)}</span><p><b>${esc(c.front)}</b></p><small>${esc(c.back)}</small><p class="muted">${isDue(c)?'待复习':'下次：'+new Date(c.due).toLocaleString()}</p><button data-id="${esc(c.id)}" onclick="edit(this.dataset.id)">编辑</button> <button class="danger" data-id="${esc(c.id)}" onclick="removeCard(this.dataset.id)">删除</button></article>`).join('')}
function resetStudy(){index=0;flipped=false;render()}function flip(){if(filtered().length){flipped=!flipped;render()}}function move(n){let l=filtered().length;if(l){index=(index+n+l)%l;flipped=false;render()}}async function grade(g){let c=filtered()[index];if(!c||!flipped||busy)return;busy=true;try{let level=g?Math.min((c.level||0)+1,6):0;let days=[0,1,3,7,14,30,60];await write({...c,level,review_count:(c.review_count||0)+1,due:now()+(g?days[level]*86400000:600000)});flipped=false;index++}catch{alert('复习进度未保存，请重试')}finally{busy=false;await sync()}}function edit(id){editing=cards.find(c=>c.id===id)||null;$('modalTitle').textContent=editing?'编辑卡片':'新建卡片';$('front').value=editing?.front||'';$('back').value=editing?.back||'';$('cat').value=editing?.category||'';$('overlay').classList.add('open');$('front').focus()}function closeEdit(){$('overlay').classList.remove('open')}async function save(e){e.preventDefault();if(busy)return;busy=true;try{let front=$('front').value.trim(),back=$('back').value.trim();if(!front||!back)throw Error();await write({...editing,id:editing?.id||uid(),front,back,category:$('cat').value.trim()||'未分类',level:editing?.level||0,review_count:editing?.review_count||0,due:editing?.due||0});closeEdit()}catch{alert('未保存，请检查输入或网络后重试')}finally{busy=false;await sync()}}async function removeCard(id){if(busy||!confirm('确定删除这张卡片？'))return;busy=true;try{await write({id,deleted:true})}catch{alert('删除失败')}finally{busy=false;await sync()}}function exportCards(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(cards,null,2)],{type:'application/json'}));a.download='拾忆备份.json';a.click();URL.revokeObjectURL(a.href)}async function importCards(el){if(busy||!el.files.length)return;busy=true;try{let a=JSON.parse(await el.files[0].text());if(!Array.isArray(a)||!a.every(c=>typeof c.front==='string'&&typeof c.back==='string'&&typeof c.category==='string'))throw Error();if(!confirm('导入 '+a.length+' 张卡片？相同ID将覆盖。'))return;for(let c of a)await write({id:typeof c.id==='string'&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(c.id)?c.id:uid(),front:c.front,back:c.back,category:c.category,level:Math.max(0,Math.min(6,Math.trunc(Number(c.level)||0))),review_count:Math.max(0,Math.trunc(Number(c.review_count)||0)),due:Number(c.due)||0});await sync()}catch{alert('导入失败，部分卡片可能已保存')}finally{el.value='';busy=false;await sync()}}sync();setInterval(sync,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});</script></html>
